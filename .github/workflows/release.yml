name: Release CI/CD (Android & Windows)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build & Sign Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Release Tag & Channel
        id: release_info
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Configure Android Signing Key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Configuring Android release signing..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "Successfully configured android/key.properties for Gradle release signing."

      - name: Build Universal APK
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          BUILD_NUM="${{ github.run_number }}"
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUM" --android-skip-build-dependency-validation

      - name: Build Split-per-ABI APKs
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          BUILD_NUM="${{ github.run_number }}"
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUM" --android-skip-build-dependency-validation

      - name: Prepare Artifact Directory
        id: artifacts
        run: |
          mkdir -p dist
          VERSION="${{ steps.release_info.outputs.version }}"
          
          # Copy universal and per-ABI APKs with clean naming
          cp build/app/outputs/flutter-apk/app-release.apk dist/Snapgrove-${VERSION}-universal.apk
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Snapgrove-${VERSION}-arm64-v8a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Snapgrove-${VERSION}-armeabi-v7a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Snapgrove-${VERSION}-x86_64.apk
          fi

      - name: Verify APK Signatures (If Keystore Provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          ANDROID_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APKSIGNER="$ANDROID_BUILD_TOOLS/apksigner"
          if [ -f "$APKSIGNER" ]; then
            for apk in dist/*.apk; do
              echo "Verifying signature for $apk..."
              "$APKSIGNER" verify --verbose "$apk" || true
            done
          fi

      - name: Clean Up Android Keystore Secrets
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/*.apk

  build-windows:
    name: Build & Sign Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Release Tag
        id: release_info
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: powershell
        run: |
          $version = "${{ steps.release_info.outputs.version }}"
          $buildNum = "${{ github.run_number }}"
          flutter build windows --release --build-name=$version --build-number=$buildNum

      - name: Sign Windows Binary (If PFX Secret Provided)
        shell: powershell
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            Write-Host "Decoding Windows code-signing certificate..."
            [IO.File]::WriteAllBytes("windows-cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            
            # Fast detection targeting modern 64-bit Windows SDK signtool
            $signtool = (Get-Item 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if (-not $signtool) {
              $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            }

            if ($signtool) {
              $releaseDir = "build\windows\x64\runner\Release"
              Write-Host "Found signtool at: $signtool"
              
              # Sign main executable and all DLLs with Authenticode SHA256
              $targets = Get-ChildItem -Path $releaseDir -Include "snapgrove.exe", "*.dll" -Recurse
              foreach ($target in $targets) {
                Write-Host "Signing $($target.FullName)..."
                & $signtool sign /f windows-cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /v $target.FullName
              }
              Write-Host "Windows binaries successfully signed with Authenticode!"
            } else {
              Write-Warning "signtool.exe not found on runner."
            }
          } else {
            Write-Host "No WINDOWS_CERT_BASE64 secret provided; building unsigned binary."
          }

      - name: Clean Up Windows Certificate Secrets
        if: always()
        shell: powershell
        run: |
          Remove-Item windows-cert.pfx -Force -ErrorAction SilentlyContinue

      - name: Package Windows Zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ steps.release_info.outputs.version }}"
          $sourceDir = "build\windows\x64\runner\Release"
          $zipPath = "dist\Snapgrove-$version-windows-x64.zip"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath $zipPath -Force
          Write-Host "Packaged Windows distribution: $zipPath"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.zip

  publish-release:
    name: Verify, Sign Checksums & Publish Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Release Tag & Channel
        id: release_info
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          
          # Detect Alpha vs Stable
          if [[ "$RAW_TAG" =~ (alpha|beta|rc|preview) ]]; then
            echo "channel=alpha" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "channel_label=Alpha Release" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "channel_label=Stable Release" >> $GITHUB_OUTPUT
          fi

      - name: Locate Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          NOTE_FILE=".github/releases/${VERSION}.md"
          ALT_FILE=".github/releases/v${VERSION}.md"
          
          if [ -f "$NOTE_FILE" ]; then
            echo "Using release notes from $NOTE_FILE"
            echo "note_path=$NOTE_FILE" >> $GITHUB_OUTPUT
          elif [ -f "$ALT_FILE" ]; then
            echo "Using release notes from $ALT_FILE"
            echo "note_path=$ALT_FILE" >> $GITHUB_OUTPUT
          else
            echo "Release note file not found; generating fallback release notes..."
            mkdir -p dist
            FALLBACK_NOTE="dist/RELEASE_NOTES_FALLBACK.md"
            cat <<EOF > "$FALLBACK_NOTE"
Hey everyone! Welcome to Snapgrove ${VERSION}. 🥳

### What's New
- Automated multi-platform build with signed binaries & cryptographic checksums.
- Performance optimizations and stability improvements.

Enjoy organizing! 😎
EOF
            echo "note_path=$FALLBACK_NOTE" >> $GITHUB_OUTPUT
          fi

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - name: Compute Cryptographic Checksums
        id: checksums
        run: |
          cd dist
          sha256sum Snapgrove-* > SHA256SUMS.txt
          cd ..

      - name: Cryptographically Sign Release Checksums & Prepare Verify Key
        env:
          RELEASE_VERIFY_PRIVATE_KEY: ${{ secrets.RELEASE_VERIFY_PRIVATE_KEY }}
        run: |
          cd dist
          if [ -n "$RELEASE_VERIFY_PRIVATE_KEY" ]; then
            printf "%s\n" "$RELEASE_VERIFY_PRIVATE_KEY" > verify.key
            openssl dgst -sha256 -sign verify.key -out SHA256SUMS.txt.sig SHA256SUMS.txt
            # Extract corresponding public verification key directly from the signing key
            openssl rsa -in verify.key -pubout -out snapgrove-release.pub 2>/dev/null || true
            rm -f verify.key
          fi
          cd ..
          
          # Fallback: copy public verification key if present in repo
          if [ ! -f "dist/snapgrove-release.pub" ] && [ -f "scripts/snapgrove-release.pub" ]; then
            cp scripts/snapgrove-release.pub dist/
          fi

      - name: Clean Up Verification Key Secrets
        if: always()
        run: |
          rm -f dist/verify.key

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Snapgrove ${{ steps.release_info.outputs.version }} (${{ steps.release_info.outputs.channel_label }})"
          body_path: ${{ steps.release_notes.outputs.note_path }}
          generate_release_notes: true
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            dist/Snapgrove-*.apk
            dist/Snapgrove-*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
            dist/snapgrove-release.pub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
